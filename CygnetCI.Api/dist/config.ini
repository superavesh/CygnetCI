# CygnetCI Configuration File

[database]
# PostgreSQL Database Configuration
host = 103.158.108.15
port = 7432
database = CygnetCI
username = CygGSPDBA
password = CygnetCI%%40123

[paths]
# File Storage Paths
nfs_shared_root = D:\Avesh\CygnetCI\SourceCode\CygnetCI\NFSShared
scripts_folder = scripts
artifacts_folder = artifacts
rollback_scripts_folder = rollback

[server]
# FastAPI Server Configuration
host = 0.0.0.0
port = 8000
reload = true
debug = true

[cors]
# CORS Configuration
allowed_origins = http://localhost:3000,http://127.0.0.1:3000,http://localhost:90,http://127.0.0.1:90,https://cygnetci.cygnet.one
allow_credentials = true

[file_transfer]
# File Transfer Settings
max_file_size_mb = 5000
allowed_script_extensions = .sh,.ps1,.py,.bat,.cmd
allowed_artifact_extensions = .zip,.tar,.gz,.jar,.war,.exe,.msi
calculate_checksum = true

[rabbitmq]
# Outbound email job queue. AMQP port is 5672 (15672 is the management UI).
enabled = true
host = localhost
port = 5672
vhost = /
username = guest
password = Admin@123
exchange = cygnetci.email
queue = email.send
dlq = email.send.dlq
routing_key = email.send

[claude_ai]
# Claude AI API Configuration for Script Analysis
api_url = https://api.anthropic.com/v1/messages
api_key = YOUR_ACTUAL_API_KEY_HERE
model = claude-3-5-sonnet-20241022
max_tokens = 4096
temperature = 0
