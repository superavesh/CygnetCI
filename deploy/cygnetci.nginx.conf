# CygnetCI nginx site config.
# Copy to /etc/nginx/sites-available/cygnetci and symlink into sites-enabled.
#
# IMPORTANT: the Web UI and the API use overlapping paths (/users, /agents, ...),
# so they must live on SEPARATE hostnames. Web = cygnetci.example.com,
# API = api.cygnetci.example.com (reverse-proxied to the systemd service).

# ---------- Web UI (Next.js static export) ----------
server {
    listen 80;
    server_name cygnetci.example.com;

    root /var/www/cygnetci;
    index index.html;

    # Static export uses trailingSlash:true -> folders with index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Never cache the runtime API config (repoint API without rebuild)
    location = /system.config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ---------- API (reverse proxy -> systemd service on 127.0.0.1:8000) ----------
server {
    listen 80;
    server_name api.cygnetci.example.com;

    # Agents upload large artifacts
    client_max_body_size 5000m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
