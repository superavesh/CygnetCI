server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export uses trailingSlash: true -> folders with index.html.
    # Try exact file, then directory, then .html, then fall back to index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Never cache the runtime API config so repointing takes effect on refresh.
    location = /system.config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Long cache for hashed static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
