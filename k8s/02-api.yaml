# CygnetCI FastAPI backend.
# config.ini is delivered as a Secret (it contains the DB password).
---
apiVersion: v1
kind: Secret
metadata:
  name: cygnetci-api-config
  namespace: cygnetci
type: Opaque
stringData:
  # Mounted at /app/config.ini. CHANGE_ME_STRONG_DB_PASSWORD must match the
  # POSTGRES_PASSWORD set in the cygnetci-db secret (01-postgres.yaml).
  # NOTE: configparser treats '%' specially -> double any literal '%' as '%%'.
  config.ini: |
    [database]
    host = cygnetci-postgres
    port = 5432
    database = CygnetCI
    username = cygnetci
    password = CHANGE_ME_STRONG_DB_PASSWORD

    [paths]
    nfs_shared_root = /data/nfsshared
    scripts_folder = scripts
    artifacts_folder = artifacts
    rollback_scripts_folder = rollback

    [server]
    host = 0.0.0.0
    port = 8000
    reload = false
    debug = false

    [cors]
    allowed_origins = https://cygnetci.example.com
    allow_credentials = true

    [file_transfer]
    max_file_size_mb = 5000
    allowed_script_extensions = .sh,.ps1,.py,.bat,.cmd
    allowed_artifact_extensions = .zip,.tar,.gz,.jar,.war,.exe,.msi
    calculate_checksum = true

    [claude_ai]
    api_url = https://api.anthropic.com/v1/messages
    api_key = CHANGE_ME_ANTHROPIC_API_KEY
    model = claude-3-5-sonnet-20241022
    max_tokens = 4096
    temperature = 0
---
# Shared storage for scripts / artifacts / rollback / uploads — the app's own
# config (config.ini [paths] nfs_shared_root) already assumes this is shared,
# NFS-style storage, so ReadWriteMany is the correct default here, not just a
# scale-out nicety. Requires a storageClassName that supports RWX (NFS / EFS /
# Azure Files / CephFS) — set one below. If only ReadWriteOnce storage is
# available in this cluster, change back to ["ReadWriteOnce"] AND keep
# cygnetci-api's replicas at 1 (multiple replicas cannot safely share an RWO volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cygnetci-shared
  namespace: cygnetci
spec:
  accessModes: ["ReadWriteMany"]
  # storageClassName: <-- an RWX-capable class, e.g. nfs-client / efs-sc / azurefile
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cygnetci-api
  namespace: cygnetci
spec:
  # Safe to raise above 1 now that cygnetci-shared is ReadWriteMany — but the
  # brute-force login lockout is still in-memory per-pod as of this writing,
  # so each replica tracks failed-login attempts independently. Fix that
  # first if raising this (see the architecture assessment, Phase 7).
  replicas: 1
  selector:
    matchLabels: { app: cygnetci-api }
  template:
    metadata:
      labels: { app: cygnetci-api }
    spec:
      containers:
        - name: api
          # CHANGE_ME_VERSION: pin to a real, immutable tag (git SHA or semver,
          # e.g. cygnetci-api:2026.09.10-a1b2c3d) — never deploy ":latest" to
          # production, since it makes rollback and "what's actually running"
          # both unreliable (a floating tag can silently change under you).
          image: REGISTRY/cygnetci-api:CHANGE_ME_VERSION
          ports:
            - containerPort: 8000
          env:
            - name: EMAIL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: cygnetci-api-secrets, key: EMAIL_ENCRYPTION_KEY }
          volumeMounts:
            - name: config
              mountPath: /app/config.ini
              subPath: config.ini
              readOnly: true
            - name: shared
              mountPath: /data/nfsshared
          # Starting-point sizing — tune from real memory/CPU usage once running.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /monitoring/api/ping, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /monitoring/api/ping, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          secret:
            secretName: cygnetci-api-config
        - name: shared
          persistentVolumeClaim:
            claimName: cygnetci-shared
---
apiVersion: v1
kind: Secret
metadata:
  name: cygnetci-api-secrets
  namespace: cygnetci
type: Opaque
stringData:
  # 32-byte key for email credential encryption. Generate a strong random value.
  EMAIL_ENCRYPTION_KEY: change-me-to-a-32-byte-random-string
  # Initial admin password used by the seed Job (03-seed-job.yaml).
  ADMIN_PASSWORD: change-me-strong-admin-pass
---
apiVersion: v1
kind: Service
metadata:
  name: cygnetci-api
  namespace: cygnetci
spec:
  selector: { app: cygnetci-api }
  ports:
    - port: 8000
      targetPort: 8000
